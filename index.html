<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상훈이의 1일1中文</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FFFFFF;
  --card: #FCE2E6;
  --nav: #8FA2C4;
  --text: #2F3D61;
  --text-mid: #5A6A8A;
  --text-light: #9AAAC4;
  --accent: #EFAAA7;
  --shadow: 0 4px 24px rgba(47,61,97,0.09);
  --radius: 16px;
  --font-ui: 'Chill Round', 'Jua', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
}

/* ── Cover ── */
.cover {
  background: var(--bg);
  padding: 20px 24px 18px;
  text-align: center;
}
.cover-ryan {
  width: 180px;
  height: 180px;
  object-fit: contain;
  display: block;
  margin: 0 auto 12px;
}
.cover-title {
  color: var(--text);
  display: inline-flex;
  align-items: flex-end;
  gap: 5px;
}
.title-korean {
  font-size: 1.7rem;
  line-height: 1;
  padding-bottom: 5px;
  letter-spacing: -0.02em;
}
.title-zhongwen-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  line-height: 1;
}
.title-pinyin {
  font-size: 0.62rem;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 400;
  letter-spacing: 0.1em;
  color: var(--text-mid);
  margin-bottom: 1px;
}
.title-zhongwen {
  font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
  font-weight: 700;
  font-size: 2.6rem;
  letter-spacing: -0.02em;
  color: var(--text);
  line-height: 1;
}
.cover-stats {
  color: var(--text-light);
  font-size: 0.72rem;
  margin-top: 8px;
  letter-spacing: 0.02em;
}
.cover-stats .stat-num {
  font-family: var(--font-ui);
  font-size: 1rem;
  color: var(--text);
  font-weight: 700;
}

/* ── Nav ── */
.nav {
  display: flex;
  background: #FFFFFF;
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 8px 12px;
  gap: 6px;
  border-bottom: 1px solid rgba(47,61,97,0.06);
  box-shadow: 0 2px 8px rgba(47,61,97,0.05);
}
.nav-btn {
  flex: 1;
  padding: 8px 6px;
  border: none;
  background: none;
  border-radius: 20px;
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--text-light);
  cursor: pointer;
  transition: all 0.2s;
}
.nav-btn.active {
  background: var(--card);
  color: var(--text);
}

/* ── Tabs ── */
.tab-content { display: none; padding: 0 0 48px; }
.tab-content.active { display: block; }

/* ── Timeline (logbook) ── */
.log-list {
  padding: 8px 0;
}
.log-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 18px 20px;
  border-bottom: 1px solid rgba(143,162,196,0.15);
}
.log-row:last-child { border-bottom: none; }
.log-day {
  font-size: 1.4rem;
  font-weight: 400;
  color: var(--accent);
  min-width: 44px;
  text-align: right;
  padding-top: 2px;
  flex-shrink: 0;
  line-height: 1;
}
.log-body {
  flex: 1;
  min-width: 0;
}
.log-meta {
  font-size: 0.65rem;
  color: var(--text-light);
  margin-bottom: 5px;
  letter-spacing: 0.01em;
}
.log-chinese {
  font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
  font-size: 1.75rem;
  color: var(--text);
  line-height: 1.2;
  margin-bottom: 5px;
}
.log-sub {
  font-size: 0.9rem;
  color: var(--text-mid);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.log-pinyin {
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--accent);
  font-weight: 600;
}
.log-dot {
  color: var(--text-light);
  font-size: 0.6rem;
}
.empty-state {
  text-align: center;
  padding: 56px 20px;
  color: var(--text-light);
  font-size: 0.88rem;
  line-height: 2.2;
}

/* ── Flashcard ── */
.fc-wrap {
  text-align: center;
  padding: 24px 16px 0;
}
.fc-progress {
  font-size: 0.72rem;
  color: var(--text-light);
  margin-bottom: 18px;
}
.fc-card-wrap {
  perspective: 1000px;
  flex: 1;
  height: 200px;
  cursor: pointer;
}
.fc-inner {
  width: 100%; height: 100%;
  transition: transform 0.55s cubic-bezier(.4,.2,.2,1);
  transform-style: preserve-3d;
  position: relative;
}
.fc-inner.flipped { transform: rotateY(180deg); }
.fc-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px 28px;
  box-shadow: var(--shadow);
  background: #FFFFFF;
  overflow: hidden;
}
.fc-face::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: var(--card);
  border-radius: var(--radius) var(--radius) 0 0;
}
.fc-back { transform: rotateY(180deg); }
.fc-card-date {
  font-size: 0.65rem;
  color: var(--text-light);
  margin-bottom: 10px;
}
.fc-card-chinese {
  font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif;
  font-size: clamp(1.8rem, 8vw, 2.6rem);
  color: var(--text);
  line-height: 1.2;
}
.fc-card-pinyin {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 1.45rem;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 12px;
  letter-spacing: 0.04em;
}
.fc-card-korean {
  font-size: 1.8rem;
  color: var(--text-mid);
}
.fc-deck-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.fc-arrow {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--text-mid);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(47,61,97,0.1);
  transition: all 0.18s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fc-arrow:active { transform: scale(0.92); }
.fc-btn {
  padding: 10px 26px;
  border-radius: 24px;
  border: none;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.82rem;
  transition: all 0.18s;
}
.fc-btn:active { transform: scale(0.96); }
.fc-btn-shuffle {
  background: var(--accent);
  color: var(--text);
}

/* ── Add Form ── */
.add-form {
  background: #FFFFFF;
  border-radius: var(--radius);
  margin: 20px 16px 0;
  padding: 24px;
  box-shadow: var(--shadow);
}
.form-title {
  font-size: 1rem;
  color: var(--text);
  margin-bottom: 20px;
}
.form-group { margin-bottom: 15px; }
.form-label {
  display: block;
  font-size: 0.68rem;
  color: var(--text-light);
  margin-bottom: 6px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.form-input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid rgba(47,61,97,0.1);
  border-radius: 10px;
  font-size: 0.9rem;
  font-family: var(--font-ui);
  color: var(--text);
  background: #FAFAFA;
  transition: border-color 0.2s, background 0.2s;
  outline: none;
}
.form-input:focus {
  border-color: var(--accent);
  background: white;
}
.form-input.chinese-input {
  font-family: 'Noto Serif TC', serif;
  font-size: 1.6rem;
  font-weight: 700;
  padding: 10px 14px 8px;
}
.form-submit {
  width: 100%;
  padding: 13px;
  border-radius: 12px;
  border: none;
  background: var(--text);
  color: white;
  font-family: var(--font-ui);
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.form-submit:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(47,61,97,0.25);
}
.form-submit:active { transform: translateY(0); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text);
  color: white;
  padding: 10px 22px;
  border-radius: 24px;
  font-family: var(--font-ui);
  font-size: 0.82rem;
  transition: transform 0.3s cubic-bezier(.34,1.4,.64,1);
  z-index: 999;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
const KEY = 'sanghun_1il1zhongwen_v1';
const START_DATE = '2026-06-01';

const SEED = [
  { id: 1, date: '2026-06-01', chinese: '生日快樂', pinyin: 'shēng rì kuài lè', korean: '생일 축하해', note: '상훈이 생일' },
  { id: 2, date: '2026-06-02', chinese: '不要生氣', pinyin: 'bú yào shēng qì', korean: '화내지 마', note: '' },
  { id: 3, date: '2026-06-03', chinese: '對不起', pinyin: 'duì bù qǐ', korean: '미안해', note: '' },
];

let vocab = JSON.parse(localStorage.getItem(KEY) || 'null');
if (!vocab) { vocab = SEED; save(); }

// 拼音更正 migration
(function() {
  const fixes = { 'duì bu qǐ': 'duì bù qǐ', 'bù yào shēng qì': 'bú yào shēng qì' };
  let changed = false;
  vocab.forEach(v => { if (fixes[v.pinyin]) { v.pinyin = fixes[v.pinyin]; changed = true; } });
  if (changed) save();
})();

let deck = [];
let deckIndex = 0;
let flipped = false;

function save() {
  localStorage.setItem(KEY, JSON.stringify(vocab));
}

function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

function dayNum(d) {
  const start = new Date(START_DATE + 'T00:00:00');
  const dt = new Date(d + 'T00:00:00');
  return Math.max(1, Math.floor((dt - start) / 86400000) + 1);
}

function updateCover() {
  document.getElementById('coverStats').innerHTML =
    `<span class="stat-num">${vocab.length}</span>일째 기록 중`;
}

function showTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'flashcard') buildDeck();
  if (name === 'add') {
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
  }
}

function renderTimeline() {
  const list = document.getElementById('timelineList');
  if (!vocab.length) {
    list.innerHTML = '<div class="empty-state">아직 기록이 없어요<br>첫 문장을 추가해보세요</div>';
    updateCover(); return;
  }
  const sorted = [...vocab].sort((a,b) => b.date.localeCompare(a.date));
  list.innerHTML = sorted.map(v => {
    const meta = fmtDate(v.date) + (v.note ? `  ·  ${v.note}` : '');
    return `
    <div class="log-row">
      <div class="log-day">${dayNum(v.date)}</div>
      <div class="log-body">
        <div class="log-meta">${meta}</div>
        <div class="log-chinese">${v.chinese}</div>
        <div class="log-sub">
          <span class="log-pinyin">${v.pinyin}</span>
          <span class="log-dot">·</span>
          <span>${v.korean}</span>
        </div>
      </div>
    </div>`;
  }).join('');
  updateCover();
}

function buildDeck() {
  deck = [...vocab].sort((a,b) => a.date.localeCompare(b.date));
  deckIndex = 0;
  renderFC();
}

function renderFC() {
  const prog = document.getElementById('fcProgress');
  if (!deck.length) {
    prog.textContent = '카드가 없어요';
    document.getElementById('fcFrontChinese').textContent = '—';
    ['fcFrontDate','fcFrontKorean','fcBackChinese','fcBackPinyin'].forEach(id => {
      document.getElementById(id).textContent = '';
    });
    return;
  }
  const v = deck[deckIndex];
  prog.textContent = `${deckIndex + 1} / ${deck.length}`;
  document.getElementById('fcFrontDate').textContent = `${fmtDate(v.date)}  ·  Day ${dayNum(v.date)}`;
  document.getElementById('fcFrontKorean').textContent = v.korean;
  document.getElementById('fcBackChinese').textContent = v.chinese;
  document.getElementById('fcBackPinyin').textContent = v.pinyin;
  flipped = false;
  document.getElementById('fcInner').classList.remove('flipped');
}

function flipCard() {
  if (!deck.length) return;
  flipped = !flipped;
  document.getElementById('fcInner').classList.toggle('flipped', flipped);
}

function nextCard() {
  if (!deck.length) return;
  deckIndex = (deckIndex + 1) % deck.length;
  renderFC();
}

function prevCard() {
  if (!deck.length) return;
  deckIndex = (deckIndex - 1 + deck.length) % deck.length;
  renderFC();
}

function shuffleCards() {
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  deckIndex = 0;
  renderFC();
  showToast('카드를 섞었어요');
}

function addEntry() {
  const date    = document.getElementById('inputDate').value;
  const chinese = document.getElementById('inputChinese').value.trim();
  const pinyin  = document.getElementById('inputPinyin').value.trim();
  const korean  = document.getElementById('inputKorean').value.trim();
  const note    = document.getElementById('inputNote').value.trim();

  if (!date || !chinese || !pinyin || !korean) {
    showToast('날짜, 중문, 병음, 한국어는 필수예요'); return;
  }

  vocab.push({ id: Date.now(), date, chinese, pinyin, korean, note });
  save(); renderTimeline();

  ['inputChinese','inputPinyin','inputKorean','inputNote'].forEach(id => {
    document.getElementById(id).value = '';
  });
  showToast('저장됐어요');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

renderTimeline();
buildDeck();
</script>
